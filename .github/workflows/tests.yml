name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  integration-tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        shell: bash
        run: |
          python --version
          python -c "import tkinter, socket; print('stdlib ready')"

      - name: Test / end-to-end transfer
        shell: bash
        run: python tests/test_integration.py

      - name: Test / folder submission
        shell: bash
        run: python tests/test_dir_submit.py

      - name: Test / folder distribution
        shell: bash
        run: python tests/test_push_dir.py

      - name: Test / concurrent queue
        shell: bash
        run: python tests/test_queue.py
